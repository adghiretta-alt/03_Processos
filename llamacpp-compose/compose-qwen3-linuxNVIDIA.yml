services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwen-server

    ports:
      - "8080:8080"

    volumes:
      - llama-models:/root/.cache

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command:
      - -hf
      - Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M
      - --alias
      - qwen3-vl
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "99"

volumes:
  llama-models: